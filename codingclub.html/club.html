<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"
     href="style2.css">
</head>
<body>
    <header class="hero">
    <h1>Coding club</h1>
    <p>Learn.Build.Share</p>
</header>
    <main>
        <section>
         <h2>Upcoming Events</h2>
         <table>  
         <thead>
            <tr>
                <th>Event</th>
                <th>Date</th>
                <th>Venue</th>
            </tr>
         </thead> 
         <tbody>
            <tr>
               <td>HTML Workshop</td> 
               <td>12 Nov</td> 
               <td>Lab 1</td> 
            </tr>
            <tr>
                <td>Hackathon</td>
                <td>12 Nov</td>
                <td>Seminar Hall</td>
            </tr>
         </tbody>
        </Table>
        </section>
        <section class="card">
            <h2>Register</h2>
            <form action="#" method="get">
                <div class="field">
                    <label for="name">Name:</label>
                    <input id="name" name="name" type="text"
                    placeholder="Your name" required>
                </div>
                <div class="field">
                    <label for="email">Email:</label>
                    <input id="email" email="email" type="text"
                    placeholder="Your email"required>
                </div>
                <button type="submit">Register</button>
            </form>
        </section>
    </main>
</body>
</html>
