<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
</head>
<body>
    <main class="Modern Caluclator">
        <h2> Calculator</h2>
        <p class="substitle">Simple&Smart</p>
        <section class="display">
            <div id="history"></div>
            <input id="screen"value="0" readonly aria-label="Caluculator Display">
        </section> 

        <section class="buttons">
            <button class="special" data-action="clear">AC</button>
            <button class="special" data-action="backspace">*</button>
            <button class="special" data-action="percent">%</button>
            <button class="operator" data-action="operator" data-value="/">/</button> 

            <button data value="7">7</button>
            <button data value="8">8</button>
            <button data value="9">9</button>
            <button class="operator" data-action="operator" data-value="*">*</button>

             <button data value="4">4</button>
            <button data value="5">5</button>
            <button data value="6">6</button>
            <button class="operator" data-action="operator" data-value="_">_</button>

             <button data value="7">7</button>
            <button data value="8">8</button>
            <button data value="9">9</button>
            <button class="operator" data-action="operator" data-value="+">+</button>

            <button data-action="sign">+_</button>
            <button data-value="0">0</button>
            <button data-action="decimal">.</button>
            <button class="equal" data-action="equals">=</button>

        </section>
        <footer>made with using javascript</footer>
    </main>
    <script src="script.js">
    </script>
</body>
</html>
